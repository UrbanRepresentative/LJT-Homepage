name: Verify Site Content

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify homepage content
        run: |
          set -e
          grep -c "Junteng Liu" _site/index.html
          grep -c "first-year PhD candidate" _site/index.html
          grep -c "HKUST NLP Group" _site/index.html
          grep -c "Shanghai Jiao Tong University" _site/index.html
          grep -c "MINIMAX" _site/index.html
          grep -c "Tencent WXG" _site/index.html
          grep -c "Shanghai AI Lab" _site/index.html
          grep -c "SynLogic" _site/index.html
          grep -c "Perception Bottleneck" _site/index.html
          grep -c "Universal Truthfulness Hyperplane" _site/index.html
          grep -c "In-Context Sharpness" _site/index.html
          grep -c "C-Eval" _site/index.html
          grep -c "Composing Parameter-Efficient Modules" _site/index.html
          grep -c "Zhiyuan Honor Scholarship" _site/index.html
          grep -c "jliugi@connect.ust.hk" _site/index.html
          grep -c "Vicent0205" _site/index.html
          grep -c "junteng88716710" _site/index.html
      - name: Verify publications page content
        run: |
          set -e
          grep -c "SynLogic" _site/publications/index.html
          grep -c "Perception Bottleneck" _site/publications/index.html
          grep -c "Universal Truthfulness Hyperplane" _site/publications/index.html
          grep -c "In-Context Sharpness" _site/publications/index.html
          grep -c "C-Eval" _site/publications/index.html
          grep -c "Composing Parameter-Efficient Modules" _site/publications/index.html
          grep -c "Preprints" _site/publications/index.html
          grep -c "Conference Papers" _site/publications/index.html
          grep -c "EMNLP 2024" _site/publications/index.html
          grep -c "ICML 2024" _site/publications/index.html
          grep -c "NeurIPS 2023" _site/publications/index.html
          ls _site/publication/
